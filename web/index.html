<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ghostglyph local textbox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 980px; margin: 2rem auto; padding: 0 1rem; line-height: 1.45; }
    textarea { width: 100%; min-height: 220px; font-family: ui-monospace, monospace; font-size: 14px; }
    pre { background: #111; color: #d8ffd8; padding: 1rem; overflow: auto; white-space: pre-wrap; }
    button { margin: .5rem .5rem .5rem 0; padding: .5rem .8rem; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <h1>Ghostglyph local textbox</h1>
  <p class="muted">Paste text below. Detection runs locally in this browser tab.</p>

  <textarea id="input" placeholder="paste suspicious text here"></textarea>
  <p>
    <button id="scan">Scan</button>
    <button id="reveal">Reveal</button>
    <button id="strip">Strip</button>
    <button id="copyClean">Copy clean</button>
  </p>

  <h2>Output</h2>
  <pre id="output">waiting...</pre>

<script>
const NAMES = new Map([
  [0x200B, ["ZWSP", "ZERO WIDTH SPACE", "zero-width"]],
  [0x200C, ["ZWNJ", "ZERO WIDTH NON-JOINER", "zero-width"]],
  [0x200D, ["ZWJ", "ZERO WIDTH JOINER", "zero-width"]],
  [0x2060, ["WJ", "WORD JOINER", "zero-width"]],
  [0xFEFF, ["BOM", "ZERO WIDTH NO-BREAK SPACE / BOM", "zero-width"]],
  [0x202A, ["LRE", "LEFT-TO-RIGHT EMBEDDING", "bidi"]],
  [0x202B, ["RLE", "RIGHT-TO-LEFT EMBEDDING", "bidi"]],
  [0x202C, ["PDF", "POP DIRECTIONAL FORMATTING", "bidi"]],
  [0x202D, ["LRO", "LEFT-TO-RIGHT OVERRIDE", "bidi"]],
  [0x202E, ["RLO", "RIGHT-TO-LEFT OVERRIDE", "bidi"]],
  [0x2066, ["LRI", "LEFT-TO-RIGHT ISOLATE", "bidi"]],
  [0x2067, ["RLI", "RIGHT-TO-LEFT ISOLATE", "bidi"]],
  [0x2068, ["FSI", "FIRST STRONG ISOLATE", "bidi"]],
  [0x2069, ["PDI", "POP DIRECTIONAL ISOLATE", "bidi"]],
  [0x200E, ["LRM", "LEFT-TO-RIGHT MARK", "bidi"]],
  [0x200F, ["RLM", "RIGHT-TO-LEFT MARK", "bidi"]],
  [0x061C, ["ALM", "ARABIC LETTER MARK", "bidi"]],
  [0x2028, ["LS", "LINE SEPARATOR", "separator"]],
  [0x2029, ["PS", "PARAGRAPH SEPARATOR", "separator"]],
]);

function classify(cp) {
  if (NAMES.has(cp)) return NAMES.get(cp);
  if (cp >= 0xE0000 && cp <= 0xE007F) return ["TAG", "UNICODE TAG CHARACTER", "tag-smuggling"];
  if ((cp >= 0xFE00 && cp <= 0xFE0F) || (cp >= 0xE0100 && cp <= 0xE01EF)) return ["VS", "VARIATION SELECTOR", "variation-selector"];
  if ((cp >= 0 && cp <= 8) || (cp >= 11 && cp <= 12) || (cp >= 14 && cp <= 31) || cp === 127 || (cp >= 128 && cp <= 159)) return ["CTRL", "CONTROL CHARACTER", "control"];
  return null;
}

function scanText(s) {
  let findings = [];
  let byteOffset = 0;
  for (const ch of s) {
    const cp = ch.codePointAt(0);
    const meta = classify(cp);
    if (meta) findings.push({ byteOffset, cp, short: meta[0], name: meta[1], cls: meta[2] });
    byteOffset += new TextEncoder().encode(ch).length;
  }
  return findings;
}

function hex(cp) { return "U+" + cp.toString(16).toUpperCase().padStart(4, "0"); }

function decodeZw(s) {
  let bits = "";
  for (const ch of s) {
    const cp = ch.codePointAt(0);
    if (cp === 0x200B) bits += "0";
    if (cp === 0x200C) bits += "1";
  }
  if (bits.length < 8 || bits.length % 8 !== 0) return "";
  let bytes = [];
  for (let i = 0; i < bits.length; i += 8) bytes.push(parseInt(bits.slice(i, i + 8), 2));
  try { return new TextDecoder("utf-8", { fatal: true }).decode(new Uint8Array(bytes)); }
  catch { return ""; }
}

function decodeTags(s) {
  let out = "";
  for (const ch of s) {
    const cp = ch.codePointAt(0);
    if (cp >= 0xE0020 && cp <= 0xE007E) out += String.fromCharCode(cp - 0xE0000);
  }
  return out;
}

function stripText(s) {
  let out = "";
  for (const ch of s) {
    if (!classify(ch.codePointAt(0))) out += ch;
  }
  return out;
}

function revealText(s) {
  let out = "";
  for (const ch of s) {
    const cp = ch.codePointAt(0);
    const meta = classify(cp);
    out += meta ? "<" + hex(cp) + ":" + meta[0] + ">" : ch;
  }
  return out;
}

function summary() {
  const s = document.getElementById("input").value;
  const findings = scanText(s);
  if (!findings.length) return "OK: no suspicious invisible/control Unicode found";
  const byClass = new Map();
  const byCode = new Map();
  for (const f of findings) {
    byClass.set(f.cls, (byClass.get(f.cls) || 0) + 1);
    const key = hex(f.cp) + " " + f.short + " " + f.name;
    byCode.set(key, (byCode.get(key) || 0) + 1);
  }
  let out = `SUSPICIOUS: ${findings.length} Unicode finding(s)\n\nby class:\n`;
  for (const [k, v] of byClass) out += `  ${k}: ${v}\n`;
  out += "\nby code point:\n";
  for (const [k, v] of byCode) out += `  ${k}: ${v}\n`;
  const zw = decodeZw(s);
  const tags = decodeTags(s);
  if (zw) out += "\ndecoded zero-width candidate:\n" + zw + "\n";
  if (tags) out += "\ndecoded Unicode Tags candidate:\n" + tags + "\n";
  return out;
}

document.getElementById("scan").onclick = () => document.getElementById("output").textContent = summary();
document.getElementById("reveal").onclick = () => document.getElementById("output").textContent = revealText(document.getElementById("input").value);
document.getElementById("strip").onclick = () => document.getElementById("output").textContent = stripText(document.getElementById("input").value);
document.getElementById("copyClean").onclick = async () => {
  const clean = stripText(document.getElementById("input").value);
  await navigator.clipboard.writeText(clean);
  document.getElementById("output").textContent = "copied sanitized text to clipboard";
};
document.getElementById("input").addEventListener("input", () => document.getElementById("output").textContent = summary());
</script>
</body>
</html>
